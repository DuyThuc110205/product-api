name: Product API Production CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  production-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build Product API Docker image
        run: docker build -t product-api:1.0 .

      - name: Start MongoDB and Product API
        run: docker compose up -d

      - name: Wait for services to become healthy
        run: |
          echo "Waiting for MongoDB and Product API..."

          for i in {1..30}; do
            MONGO_STATUS=$(docker inspect --format='{{.State.Health.Status}}' nammongodb 2>/dev/null || echo "starting")
            API_STATUS=$(docker inspect --format='{{.State.Health.Status}}' product-api 2>/dev/null || echo "starting")

            echo "MongoDB: $MONGO_STATUS"
            echo "Product API: $API_STATUS"

            if [ "$MONGO_STATUS" = "healthy" ] && [ "$API_STATUS" = "healthy" ]; then
              echo "Both services are healthy."
              exit 0
            fi

            sleep 5
          done

          echo "Services did not become healthy."
          docker compose ps
          docker compose logs
          exit 1

      - name: Test GET products
        run: |
          curl --fail http://localhost:3000/api/products

      - name: Test POST product
        run: |
          curl --fail -X POST http://localhost:3000/api/products \
            -H "Content-Type: application/json" \
            -d '{
              "pid": "CI001",
              "pname": "CI Test Product",
              "price": 100000,
              "quantity": 10
            }'

      - name: Test GET product by ID
        run: |
          curl --fail http://localhost:3000/api/products/CI001

      - name: Test PUT product
        run: |
          curl --fail -X PUT http://localhost:3000/api/products/CI001 \
            -H "Content-Type: application/json" \
            -d '{
              "pname": "CI Updated Product",
              "price": 200000,
              "quantity": 20
            }'

      - name: Test DELETE product
        run: |
          curl --fail -X DELETE http://localhost:3000/api/products/CI001

      - name: Show Docker Compose status
        if: always()
        run: docker compose ps

      - name: Show Docker Compose logs
        if: always()
        run: docker compose logs